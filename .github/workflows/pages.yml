name: Publish OPEN SVG GALARY

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "vendor/**"
      - "doodles/**"
      - "assets/**"
      - "licenses/**"
      - "scripts/catalogue.mjs"
      - "scripts/verify-assets.mjs"
      - "package.json"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site and SVG collection
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Automatically catalogue and validate SVGs
        run: |
          npm run catalogue
          npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R src assets doodles vendor licenses _site/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
