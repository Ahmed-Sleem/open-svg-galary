<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="Explore, inspect, and download original SVG doodles from OPEN SVG GALARY." />
    <title>OPEN SVG GALARY — SVG Doodles</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="app">
      <h1 class="sr-only">OPEN SVG GALARY</h1>
      <div id="universe" tabindex="0" aria-label="SVG doodle universe. Drag or scroll to explore. Arrow keys move the canvas; Enter selects a doodle; R recentres it.">
        <span id="hover-tooltip" class="hover-tooltip" hidden></span>
      </div>
      <header class="site-brand" aria-label="OPEN SVG GALARY">
        <span class="brand-spark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 14 9l6.2 2.2L14 13.4 12 20l-2.2-6.6L3.5 11.2 9.8 9 12 2.8Z"/><path d="m19.1 16 .8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8.8-2.1Z"/></svg>
        </span>
        <span class="brand-wordmark"><span class="brand-open">OPEN</span><span class="brand-name">SVG GALARY</span></span>
        <span class="brand-dot" aria-hidden="true"></span>
      </header>
      <button id="render-mode-toggle" class="mode-toggle" type="button" role="switch" aria-checked="false" aria-label="SVG appearance: Shine" title="Switch between shine and true-colour SVGs">
        <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1.8 11.7 7l5.2 1.8-5.2 1.8L10 16l-1.8-5.4L3 8.8 8.2 7 10 1.8Z"/><path d="m16.1 13 .7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7.7-1.7Z"/></svg></span>
        <span id="mode-label" class="mode-label">Shine</span>
        <span class="mode-track" aria-hidden="true"><span class="mode-thumb"></span></span>
      </button>
      <div id="loading" class="loading" role="status">
        <span class="loading-dot"></span><span id="loading-text">Loading your universe</span>
      </div>
      <span class="explore-hint">drag to explore · click a doodle</span>
      <section id="accessible-catalogue" class="sr-only" aria-label="All doodles"></section>
    </main>

    <aside id="doodle-card" class="doodle-card" aria-labelledby="card-title" hidden>
      <header class="inspector-header">
        <span class="inspector-eyebrow">Inspector</span>
        <div class="inspector-tools">
          <span class="svg-badge">SVG</span>
          <button id="close-card" type="button" class="close-card" aria-label="Close inspector">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m18 6-12 12M6 6l12 12"/></svg>
          </button>
        </div>
      </header>
      <h2 id="card-title" class="card-title"></h2>
      <div class="inspector-meta">
        <span id="card-category" class="card-category"></span>
        <span id="card-size" class="card-size">Editable vector</span>
      </div>
      <div class="preview-frame">
        <div id="doodle-preview" class="doodle-preview" aria-hidden="true"></div>
        <span class="preview-corner corner-tl" aria-hidden="true"></span><span class="preview-corner corner-tr" aria-hidden="true"></span>
        <span class="preview-corner corner-bl" aria-hidden="true"></span><span class="preview-corner corner-br" aria-hidden="true"></span>
        <span class="preview-caption">Resolution independent</span>
      </div>
      <div class="format-row">
        <span class="format-row-label">Copy as</span>
        <button id="format-trigger" type="button" class="format-trigger" role="combobox" aria-label="Copy format" aria-haspopup="listbox" aria-expanded="false" aria-controls="format-menu">
          <span id="format-label">SVG</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div class="inspector-actions">
        <button id="copy-doodle" type="button" class="action-button copy-button" aria-label="Copy" disabled>
          <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></svg>
          <span id="copy-label">Copy</span>
        </button>
        <button id="download-doodle" type="button" class="action-button download-button" aria-label="Download SVG" title="Download the original, editable SVG" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>
          Download
        </button>
      </div>
    </aside>
    <div id="format-menu" class="format-menu" role="listbox" aria-label="Copy format" hidden></div>
    <span id="copy-feedback" class="sr-only" role="status" aria-live="polite"></span>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="manual-copy-dialog" class="manual-copy-dialog">
      <h2 id="manual-copy-heading">Copy your doodle</h2>
      <p id="manual-copy-help">Your browser blocked automatic copying. Select the code below and press Ctrl+C or ⌘C.</p>
      <textarea id="manual-copy-code" readonly aria-label="Doodle code" spellcheck="false"></textarea>
      <button id="close-manual-copy" type="button">Done</button>
    </dialog>
    <noscript><div class="noscript">Enable JavaScript to explore and download the SVG collection.</div></noscript>
    <script id="app-entry" type="module" src="./src/app.js"></script>
  </body>
</html>
